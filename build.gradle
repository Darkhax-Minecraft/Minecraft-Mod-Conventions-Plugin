plugins {
    id 'java'
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.1.1'
}

apply from: 'gradle/property_loader.gradle'
group = 'net.darkhax.mmc'
version = '26.1.0'
def buildNumber = System.getenv('BUILD_NUMBER') ? System.getenv('BUILD_NUMBER') : System.getenv('TRAVIS_BUILD_NUMBER') ? System.getenv('TRAVIS_BUILD_NUMBER') : '0'
version = "${project.version}.${buildNumber}".toString()

gradlePlugin {
    plugins {
        website = 'https://github.com/Darkhax-Minecraft/Minecraft-Mod-Conventions-Plugin'
        vcsUrl = 'https://github.com/Darkhax-Minecraft/Minecraft-Mod-Conventions-Plugin.git'
        register('mmcPlugin') {
            id = 'net.darkhax.mmc'
            displayName = "Multiloader Conventions Plugin"
            description = "A highly opinionated conventions plugin for developing Minecraft mods that are compatible with multiple mod loaders."
            implementationClass = 'net.darkhax.mmc.ConventionsPlugin'
            tags.set(['mod', 'minecraft'])
        }
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = uri('https://maven.fabricmc.net')
            }
        }
        filter {
            includeGroupAndSubgroups 'net.fabricmc'
            includeGroup 'fabric-loom'
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'net.darkhax.curseforgegradle:net.darkhax.curseforgegradle.gradle.plugin:1.2.30'
    implementation 'com.modrinth.minotaur:com.modrinth.minotaur.gradle.plugin:2.9.0'
    implementation 'net.neoforged.moddev:net.neoforged.moddev.gradle.plugin:2.0.141'
    implementation 'fabric-loom:fabric-loom.gradle.plugin:1.15-SNAPSHOT'
}